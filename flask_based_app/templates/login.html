{% extends 'base.html' %}

{% block title %}Login — CPF{% endblock %}

{% block content %}
<div class="auth-split">
    <!-- Decorative left panel -->
    <div class="auth-deco">
        <div class="auth-deco-quote">
            First, solve the problem. Then, write the code.
        </div>
        <div class="auth-deco-author">— John Johnson</div>

        <!-- Abstract decorative shapes -->
        <svg class="auth-deco-shapes" width="200" height="200" viewBox="0 0 200 200" fill="none">
            <circle cx="100" cy="100" r="80" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
            <circle cx="100" cy="100" r="50" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
            <line x1="20" y1="100" x2="180" y2="100" stroke="currentColor" stroke-width="0.3" opacity="0.15"/>
            <line x1="100" y1="20" x2="100" y2="180" stroke="currentColor" stroke-width="0.3" opacity="0.15"/>
        </svg>
    </div>

    <!-- Form side -->
    <div class="auth-form-side">
        <h2 class="auth-heading animate-in">Yo, welcome back.</h2>
        <p class="auth-subheading animate-in delay-1">Pick up where you left off.</p>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group animate-in delay-2">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" name="email" class="form-control" placeholder="you@example.com" required autofocus>
            </div>
            <div class="form-group animate-in delay-3">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="checkbox-group animate-in delay-3">
                <input type="checkbox" id="remember-me">
                <label for="remember-me">Keep me signed in</label>
            </div>

            <button type="submit" class="btn animate-in delay-4" style="width: 100%;">Login</button>
        </form>

        <p class="auth-hint animate-in delay-4">
            Don't have an account? <a href="{{ url_for('register') }}">Sign up here</a>
        </p>
        <span class="auth-kb-hint animate-in delay-4">Press Enter to submit</span>
    </div>
</div>
{% endblock %}
